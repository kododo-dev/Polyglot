name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore src/Polyglot.slnx

      - name: Build
        run: dotnet build src/Polyglot.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/Polyglot.slnx --no-build --configuration Release --logger "trx;LogFileName=results.trx"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t polyglot:ci .
