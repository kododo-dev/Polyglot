name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The Docker publish workflow runs CI first.
  workflow_call:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Polyglot.Web/UI/package-lock.json

      # The pages' Way.Shell module, embedded in Polyglot.Web.
      - name: Lint and build the UI
        working-directory: src/Polyglot.Web/UI
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore src/Polyglot.slnx

      - name: Build
        run: dotnet build src/Polyglot.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/Polyglot.slnx --no-build --configuration Release --logger "trx;LogFileName=results.trx"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t polyglot:ci .
